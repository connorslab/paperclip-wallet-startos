name: Private test candidate
on:
  push:
    branches: [codex/test-package-71]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned wallet source
        id: wallet-source
        run: |
          python3 -m unittest discover -s scripts -p 'test_*.py'
          revision=$(python3 scripts/pinned_source.py)
          printf 'revision=%s\n' "$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          repository: connorslab/paperclip-wallet-app
          ref: ${{ steps.wallet-source.outputs.revision }}
          path: upstream
      - uses: Start9Labs/start-technologies/.github/actions/setup-build-env@16edbd58ce7b19889b9217489f3b49ea1835deb7
      - name: Validate source and wrapper
        run: |
          python3 scripts/pinned_source.py --checkout upstream --provenance > source-provenance.json
          npm ci
          npm run check
          (cd upstream && sha256sum -c SHARED-SOURCE.sha256)
          (cd upstream && PYTHONPATH=deployment python3 -m unittest test_package test_container test_platform_node test_managed_chain test_node_tor test_pruned_rpc)
      - name: Build and test isolated wallet
        run: |
          revision=$(python3 scripts/pinned_source.py --checkout upstream)
          docker build -f upstream/deployment/Dockerfile --build-arg BARK_VERSION=0.10.0 --build-arg "GIT_HASH=$revision" -t paperclip-test:local upstream
          docker run --rm --network none --entrypoint paperclip-walletd paperclip-test:local --version | grep -F "$revision"
          docker run --rm --network none -v "$PWD/upstream:/tests:ro" --entrypoint python3 paperclip-test:local /tests/deployment/test_daemon.py
          docker run --rm --network none -v "$PWD/upstream:/tests:ro" --entrypoint python3 paperclip-test:local /tests/deployment/desktop/test_native_daemon.py --binary /usr/local/bin/paperclip-walletd
      - name: Test the pinned Jam companion without live services
        run: |
          docker build -f upstream/deployment/jam/Dockerfile -t paperclip-jam:test upstream
          docker run --rm --network none --entrypoint /opt/venv/bin/python -e PYTHONPATH=/tests -e PAPERCLIP_CONTAINER_TESTS=1 -v "$PWD/upstream/deployment/jam:/tests:ro" paperclip-jam:test -m unittest discover -s /tests -p 'test_*.py'
      - name: Sign test package with existing identity
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: |
          umask 077
          test -n "$DEV_KEY"
          mkdir -p .startos
          printf '%s' "$DEV_KEY" > .startos/build-key
          trap 'rm -f .startos/build-key' EXIT
          make arch/${{ matrix.arch }}
          sha256sum paperclip-wallet_${{ matrix.arch }}.s9pk > paperclip-wallet_${{ matrix.arch }}.s9pk.sha256
          start-cli s9pk inspect paperclip-wallet_${{ matrix.arch }}.s9pk manifest > manifest-${{ matrix.arch }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: paperclip-test-${{ matrix.arch }}
          path: |
            *.s9pk
            *.s9pk.sha256
            manifest-*.json
            source-provenance.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
