name: Build

on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['*.md']
    branches: ['main']

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  signing-key:
    runs-on: ubuntu-latest
    steps:
      - name: Require the existing package signing identity
        env:
          DEV_KEY: ${{ secrets.DEV_KEY }}
        run: |
          test -n "$DEV_KEY" || { echo 'Configure the owner-controlled DEV_KEY before building release packages.'; exit 1; }
  build:
    needs: signing-key
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    uses: Start9Labs/start-technologies/.github/workflows/build.yml@master
    secrets:
      DEV_KEY: ${{ secrets.DEV_KEY }}
